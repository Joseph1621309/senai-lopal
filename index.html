<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Lopal - Senai</h1>
    <script>
       console.log("Hello Hermanoteu!");
       alert("Olá, Godah!")

       let num_one = Number(prompt("Digite o primeiro numero: "))
       let num_two = Number(prompt("Digite o segundo numero: "))

       console.log(typeof num_one)
       console.log(typeof num_two)

       var sum = num_one + num_two

       var sub = num_two - num_one

       var mult = num_one * num_two
       
       var div = num_two / num_one

       var pot = num_one ** num_two

       console.log(`soma de: ${num_one} + ${num_two} = ${sum}`);
       alert(`soma de: ${num_one} + ${num_two} = ${sum}`);

       console.log(`subtração de: ${num_two} - ${num_one} = ${sub}`);
       alert(`subtração de: ${num_two} - ${num_one} = ${sub}`);

       console.log(`multiplicação de: ${num_one} * ${num_two} = ${mult}`);
       alert(`multiplicação de: ${num_one} * ${num_two} = ${mult}`);
        
       console.log(`divisão de: ${num_two} / ${num_one} = ${div}`);
       alert(`divisão de: ${num_two} / ${num_one} = ${div}`);

       console.log(`A potencia de: ${num_one} com ${num_two} = ${pot}`);
       alert(`A potencia de: ${num_one} elevado à ${num_two} = ${pot}`);



    </script>
</body>
</html>
